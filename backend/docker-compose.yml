version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - TWO_FACTOR_API_KEY=${TWO_FACTOR_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
    restart: unless-stopped
